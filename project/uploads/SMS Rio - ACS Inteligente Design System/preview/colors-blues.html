<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: flex; gap: 16px; align-items: stretch; }
  .sw { flex: 1; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .blk { height: 70px; }
  .meta { padding: 8px 10px; background: #fff; border-top: 1px solid #eee; }
  .name { font-size: 12px; font-weight: 700; color: #181818; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: #666; margin-top: 2px; }
  h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: #666; margin: 0 0 10px; }
</style></head>
<body>
  <h4>Azuis institucionais</h4>
  <div class="row">
    <div class="sw"><div class="blk" style="background:#004a80"></div><div class="meta"><div class="name">Blue Primary</div><div class="hex">#004a80</div></div></div>
    <div class="sw"><div class="blk" style="background:#00508a"></div><div class="meta"><div class="name">Blue Secondary</div><div class="hex">#00508a</div></div></div>
    <div class="sw"><div class="blk" style="background:#003660"></div><div class="meta"><div class="name">Blue Dark</div><div class="hex">#003660</div></div></div>
    <div class="sw"><div class="blk" style="background:#1863dc"></div><div class="meta"><div class="name">Blue Light · CTA</div><div class="hex">#1863dc</div></div></div>
  </div>
</body></html>
