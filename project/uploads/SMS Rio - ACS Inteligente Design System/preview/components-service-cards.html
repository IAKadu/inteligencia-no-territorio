<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card { background: #ededed; border-radius: 4px; min-height: 86px; display: flex; align-items: center; justify-content: center; padding: 14px; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #181818; line-height: 1.4; cursor: pointer; transition: background .15s, box-shadow .15s; }
  .card:hover { background: #fff; box-shadow: 0 4px 12px rgba(0,74,128,.15); }
</style></head>
<body>
  <div class="grid">
    <div class="card">Visitas do ACS</div>
    <div class="card">Agendamentos</div>
    <div class="card">Urgência e Emergência</div>
    <div class="card">Mapa do Território</div>
    <div class="card">Vacinação contra a Gripe</div>
    <div class="card">Saúde Mental</div>
    <div class="card">IST / AIDS</div>
    <div class="card">Pré-Natal</div>
  </div>
</body></html>
