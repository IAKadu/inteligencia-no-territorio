<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 28px; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 4px; font-size: 14px; font-weight: 700; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .p1 { background: rgba(220,53,69,.1); color: #9b1c28; }
  .p1 .dot { background: #dc3545; }
  .p2 { background: rgba(253,126,20,.1); color: #8d4a0c; }
  .p2 .dot { background: #fd7e14; }
  .p3 { background: rgba(255,193,7,.14); color: #856404; }
  .p3 .dot { background: #ffc107; }
  .p4 { background: rgba(40,167,69,.1); color: #1a6630; }
  .p4 .dot { background: #28a745; }
  h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: #666; margin: 0 0 12px; }
</style></head>
<body>
  <h4>Sistema de prioridade clínica (P1 → P4)</h4>
  <div class="row">
    <div class="item p1"><span class="dot"></span>P1 · Urgente</div>
    <div class="item p2"><span class="dot"></span>P2 · Alto risco</div>
    <div class="item p3"><span class="dot"></span>P3 · Médio</div>
    <div class="item p4"><span class="dot"></span>P4 · Rotina</div>
  </div>
</body></html>
