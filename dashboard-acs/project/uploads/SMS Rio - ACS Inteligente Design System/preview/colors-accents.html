<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: flex; gap: 16px; }
  .sw { flex: 1; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .blk { height: 70px; }
  .meta { padding: 8px 10px; background: #fff; border-top: 1px solid #eee; }
  .name { font-size: 12px; font-weight: 700; color: #181818; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: #666; margin-top: 2px; }
  h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: #666; margin: 0 0 10px; }
</style></head>
<body>
  <h4>Acentos & estados — feedback clínico</h4>
  <div class="row">
    <div class="sw"><div class="blk" style="background:#00c0f4"></div><div class="meta"><div class="name">Cyan</div><div class="hex">#00c0f4</div></div></div>
    <div class="sw"><div class="blk" style="background:#0bb975"></div><div class="meta"><div class="name">Green</div><div class="hex">#0bb975</div></div></div>
    <div class="sw"><div class="blk" style="background:#28a745"></div><div class="meta"><div class="name">Rotina</div><div class="hex">#28a745</div></div></div>
    <div class="sw"><div class="blk" style="background:#ffc107"></div><div class="meta"><div class="name">Médio</div><div class="hex">#ffc107</div></div></div>
    <div class="sw"><div class="blk" style="background:#fd7e14"></div><div class="meta"><div class="name">Alto</div><div class="hex">#fd7e14</div></div></div>
    <div class="sw"><div class="blk" style="background:#dc3545"></div><div class="meta"><div class="name">Urgente</div><div class="hex">#dc3545</div></div></div>
  </div>
</body></html>
