<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; background: #fff; font-family: var(--font-body); }
  .bar { background: #363636; padding: 8px 24px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.7); display: flex; gap: 22px; }
  .bar .end { margin-left: auto; opacity: .65; }
  .nav { background: #004a80; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; color: #fff; }
  .logo { display: flex; align-items: baseline; gap: 10px; font-weight: 900; font-size: 20px; }
  .logo .rio { color: #0bb975; }
  .logo .sep { opacity: .35; font-weight: 400; padding: 0 4px; }
  .logo .sub { font-weight: 400; font-size: 18px; opacity: .92; }
  .links { display: flex; gap: 24px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
</style></head>
<body>
  <div class="bar">
    <span>PREFEITURA.RIO</span>
    <span class="end">Acessibilidade · Carioca Digital · 1746</span>
  </div>
  <div class="nav">
    <div class="logo">Prefeitura <span class="rio">RIO</span> <span class="sep">·</span> <span class="sub">Saúde</span></div>
    <div class="links"><span>Conheça</span><span>Serviços</span><span>Unidades de Saúde</span></div>
  </div>
</body></html>
