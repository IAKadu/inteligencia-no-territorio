<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: #fff; }
  .grid { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .block { background: #004a80; opacity: .35; border-radius: 2px; }
  .name { font-family: var(--font-mono); font-size: 10px; color: #888; }
  .val  { font-size: 11px; font-weight: 700; color: #181818; }
</style></head>
<body>
  <div class="grid">
    <div class="item"><div class="block" style="width:4px;height:4px;"></div><span class="name">--space-1</span><span class="val">4</span></div>
    <div class="item"><div class="block" style="width:8px;height:8px;"></div><span class="name">--space-2</span><span class="val">8</span></div>
    <div class="item"><div class="block" style="width:12px;height:12px;"></div><span class="name">--space-3</span><span class="val">12</span></div>
    <div class="item"><div class="block" style="width:16px;height:16px;"></div><span class="name">--space-4</span><span class="val">16</span></div>
    <div class="item"><div class="block" style="width:24px;height:24px;"></div><span class="name">--space-5</span><span class="val">24</span></div>
    <div class="item"><div class="block" style="width:32px;height:32px;"></div><span class="name">--space-6</span><span class="val">32</span></div>
    <div class="item"><div class="block" style="width:48px;height:48px;"></div><span class="name">--space-7</span><span class="val">48</span></div>
    <div class="item"><div class="block" style="width:64px;height:64px;"></div><span class="name">--space-8</span><span class="val">64</span></div>
  </div>
</body></html>
