<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 4px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border: 2px solid transparent; cursor: pointer; font-family: var(--font-body); }
  .btn-lg { padding: 14px 28px; font-size: 14px; }
  .btn-sm { padding: 6px 14px; font-size: 11px; }
  .btn-primary { background: #004a80; color: #fff; }
  .btn-secondary { background: transparent; border-color: #004a80; color: #004a80; }
  .btn-cta { background: #1863dc; color: #fff; }
  .btn-green { background: #0bb975; color: #fff; }
  h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: #666; margin: 0 0 10px; }
</style></head>
<body>
  <h4>Botões — primary · secondary · CTA · success</h4>
  <div class="row">
    <button class="btn btn-primary btn-lg">Ver Lista de Visitas</button>
    <button class="btn btn-primary">Confirmar Visita</button>
    <button class="btn btn-secondary">Ver Perfil</button>
    <button class="btn btn-cta">Iniciar Jornada</button>
    <button class="btn btn-green">Visita Concluída</button>
    <button class="btn btn-primary btn-sm">Filtrar</button>
  </div>
</body></html>
