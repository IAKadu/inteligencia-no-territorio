<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: flex; gap: 16px; }
  .sw { flex: 1; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); border:1px solid #f0f0f0; }
  .blk { height: 70px; }
  .meta { padding: 8px 10px; background: #fff; border-top: 1px solid #eee; }
  .name { font-size: 12px; font-weight: 700; color: #181818; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: #666; margin-top: 2px; }
  h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: #666; margin: 0 0 10px; }
</style></head>
<body>
  <h4>Neutros — layout & texto</h4>
  <div class="row">
    <div class="sw"><div class="blk" style="background:#181818"></div><div class="meta"><div class="name">Text Dark</div><div class="hex">#181818</div></div></div>
    <div class="sw"><div class="blk" style="background:#333"></div><div class="meta"><div class="name">Text Body</div><div class="hex">#333333</div></div></div>
    <div class="sw"><div class="blk" style="background:#363636"></div><div class="meta"><div class="name">Grey Bar</div><div class="hex">#363636</div></div></div>
    <div class="sw"><div class="blk" style="background:#cac7c7"></div><div class="meta"><div class="name">Grey Mid</div><div class="hex">#cac7c7</div></div></div>
    <div class="sw"><div class="blk" style="background:#ededed"></div><div class="meta"><div class="name">Grey Card</div><div class="hex">#ededed</div></div></div>
    <div class="sw"><div class="blk" style="background:#fff"></div><div class="meta"><div class="name">White</div><div class="hex">#ffffff</div></div></div>
  </div>
</body></html>
