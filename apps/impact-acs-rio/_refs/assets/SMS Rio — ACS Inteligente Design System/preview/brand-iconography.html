<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>

  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .ico { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #004a80; background: #ededed; border-radius: 4px; }
  .lbl { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
</style></head>
<body>
  <h4>Iconografia — Lucide (CDN), 1.75px stroke, currentColor</h4>
